[package]
name = "raclette"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
derivative = "2.2.0"
derive_more = { version = "2.1.1", features = ["full"] }
dirs-next = "2.0.0"
either = "1.18.0"
enum-map = "3.1.0"
itertools = "0.15.0"
lalrpop-util = "0.23.1"
logos = "0.16.1"
malachite = { version = "0.11.0", default-features = false, features = ["naturals_and_integers", "rationals"] }
miette = { version = "7.6.0", features = ["fancy"] }
once_cell = "1.21.4"
rustyline = "18.0.1"
thiserror = "2.0.20"

[build-dependencies]
lalrpop = { version = "0.23.1", default-features = false }

[profile.release]
debug = true

[dev-dependencies]
#criterion = "0.3.6"
#pprof = { version = "0.10.0", features = ["flamegraph"] }
